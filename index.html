<!DOCTYPE html>
<html lang="cs">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Lada BINGO</title>
<style>
  :root {
    --bg: #FFFFFF;
    --ink: #000000;
    --orange: #FFB346;
    --yellow: #F7D771;
    --red: #E2001A;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    min-height: 100vh;
    font-family: Georgia, 'Times New Roman', serif;
    background: var(--bg);
    color: var(--ink);
    display: flex;
    flex-direction: column;
    align-items: center;
    padding: 28px 14px 60px;
  }
  h1 {
    color: var(--ink);
    font-size: clamp(1.8rem, 6vw, 2.8rem);
    margin: 4px 0 0;
    text-align: center;
    letter-spacing: 3px;
    font-weight: 700;
  }
  .ribbon {
    width: 150px;
    height: 6px;
    margin: 8px auto 18px;
    background: linear-gradient(90deg, var(--orange) 0 33%, var(--yellow) 33% 66%, var(--red) 66% 100%);
  }
  .subtitle {
    color: #333333;
    margin-bottom: 18px;
    text-align: center;
    font-size: 0.92rem;
    max-width: 480px;
    font-family: Verdana, sans-serif;
  }
  .controls {
    display: flex;
    gap: 10px;
    flex-wrap: wrap;
    justify-content: center;
    margin-bottom: 20px;
    font-family: Verdana, sans-serif;
  }
  button {
    background: var(--orange);
    color: var(--ink);
    border: 2px solid var(--ink);
    padding: 9px 16px;
    font-size: 0.88rem;
    font-weight: bold;
    border-radius: 2px;
    cursor: pointer;
    box-shadow: 3px 3px 0 var(--ink);
  }
  button:active { transform: translate(2px, 2px); box-shadow: 1px 1px 0 var(--ink); }
  button.secondary {
    background: var(--yellow);
    color: var(--ink);
    border: 2px solid var(--ink);
  }
  #bingo-card {
    background: var(--bg);
    padding: 14px;
    border: 4px solid var(--ink);
    border-radius: 2px;
    max-width: 600px;
    width: 100%;
  }
  #card-title {
    text-align: center;
    font-weight: 700;
    font-size: 1.3rem;
    color: var(--ink);
    margin-bottom: 10px;
    padding-bottom: 8px;
    letter-spacing: 4px;
    border-bottom: 3px solid var(--red);
  }
  #grid {
    display: grid;
    grid-template-columns: repeat(5, minmax(0, 1fr));
    gap: 4px;
    width: 100%;
  }
  .cell {
    background: #ffffff;
    border: 2px solid var(--ink);
    aspect-ratio: 1 / 1;
    display: flex;
    align-items: center;
    justify-content: center;
    text-align: center;
    padding: 4px;
    font-size: clamp(0.5rem, 1.9vw, 0.72rem);
    line-height: 1.15;
    cursor: pointer;
    user-select: none;
    color: var(--ink);
    font-family: Verdana, sans-serif;
    font-weight: 600;
    min-width: 0;
    min-height: 0;
    overflow-wrap: break-word;
    word-break: break-word;
    transition: background 0.1s, border-color 0.1s;
  }
  .cell:hover { border-color: var(--orange); }
  .cell.marked {
    background: var(--red);
    color: #ffffff;
    border-color: var(--red);
  }
  footer {
    color: #555555;
    margin-top: 22px;
    font-size: 0.78rem;
    text-align: center;
    opacity: 0.9;
    font-family: Verdana, sans-serif;
  }
  @media print {
    body { background: #fff; padding: 0; }
    .controls, .ribbon, footer { display: none; }
  }
</style>
</head>
<body>

<h1>Lada BINGO</h1>
<div class="ribbon"></div>
<!-- <p class="subtitle">Klikni na políčko, jak se to na akci stane. Chceš jinou kartičku? Vygeneruj si novou.</p>
-->
<div class="controls">
  <button id="btn-new">Nová kartička</button>
  <button id="btn-download" class="secondary">Stáhnout jako obrázek</button>
</div>

<div id="bingo-card">
  <div id="card-title">LADA BINGO</div>
  <div id="grid"></div>
</div>

<!-- <footer>Kartička se ukládá v tomto zařízení, takže po obnovení stránky zůstane.</footer>
-->
<script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
<script>
  // ====================================================================
  // SEZNAM POLOŽEK — sem přidávej nebo odsud maž jednotlivé řádky.
  // Každý řádek = jedna možná věc/stav na bingo kartičce.
  // Potřeba je aspoň 25 položek (5×5 = 25 políček), klidně jich má být
  // víc, pak se pokaždé vygeneruje jiný výběr.
  // ====================================================================
  const ITEMS = [
    "dva kroky a dva kroky a přešlap",
    "paní Leníková",
    "Ladislav Špaček",
    "vyhrožuje sólem za zlobení",
    "držení",
    "zvednuté lokty",
    "asistenti",
    "bordel v předsálí",
    "Jarda, bar a alkohol",
    "rekonstrukce - prodloužila sál o 5 metrů",
    "Chlopčík",
    "Stardance",
    "Martin",
    "politika",
    "žvýkačka",
    "pár stojí před hosty (blokuje výhled)",
    "napište mi na IG",
    "sledujte mě na IG",
    "mezi vás by se vešel - tenisák/ : balónek - běžte bliž k sobě",
    "Václav",
    "Láď'a Motyčka",
    "proti sobě otevři",
    "udělejte dva kruhy",
    "odvalovat od paty",
    "Lada rozdělí pár asistentům",
    "stojíme na špičkách",
    "zmínka o terase",
    "ruka tanečníka je moc nízko",
    "tanečníci nevyužívají celý sál",
    "kvapík",
    "to je jasný",
    "koukat do očí / nekoukat na nohy",
    "povídání s hosty",
    "zády k pódiu",
    "čelem ve směru tance",
    "krátký kroky",
    "sólo real shit",
    "třpytivé šaty",
    "Krkonoše🌲",
    "divošky",
    "běžte dál od židlí"
];

  // ====================================================================

  const GRID_SIZE = 5;
  const CELL_COUNT = GRID_SIZE * GRID_SIZE;

  const gridEl = document.getElementById('grid');

  function shuffle(arr) {
    const a = [...arr];
    for (let i = a.length - 1; i > 0; i--) {
      const j = Math.floor(Math.random() * (i + 1));
      [a[i], a[j]] = [a[j], a[i]];
    }
    return a;
  }

  function makeCell(text, marked) {
    const cell = document.createElement('div');
    cell.className = 'cell' + (marked ? ' marked' : '');
    cell.textContent = text;
    cell.addEventListener('click', () => {
      cell.classList.toggle('marked');
      saveState();
    });
    return cell;
  }

  function buildCard() {
    if (ITEMS.length < CELL_COUNT) {
      gridEl.innerHTML = '<p style="grid-column:1/-1;color:#b3122d;text-align:center;font-family:Verdana,sans-serif;">' +
        'Potřeba aspoň ' + CELL_COUNT + ' položek v seznamu ITEMS, teď jich je ' + ITEMS.length + '.</p>';
      return;
    }
    const chosen = shuffle(ITEMS).slice(0, CELL_COUNT);
    gridEl.innerHTML = '';
    chosen.forEach(text => gridEl.appendChild(makeCell(text, false)));
    saveState();
  }

  function saveState() {
    const cells = [...gridEl.querySelectorAll('.cell')];
    const state = cells.map(c => ({ text: c.textContent, marked: c.classList.contains('marked') }));
    localStorage.setItem('ladaBingoState', JSON.stringify(state));
  }

  function loadState() {
    const raw = localStorage.getItem('ladaBingoState');
    if (!raw) return false;
    try {
      const state = JSON.parse(raw);
      if (!Array.isArray(state) || state.length !== CELL_COUNT) return false;
      gridEl.innerHTML = '';
      state.forEach(item => gridEl.appendChild(makeCell(item.text, item.marked)));
      return true;
    } catch (e) {
      return false;
    }
  }

  document.getElementById('btn-new').addEventListener('click', buildCard);

  document.getElementById('btn-download').addEventListener('click', () => {
    const card = document.getElementById('bingo-card');
    html2canvas(card, { scale: 2, backgroundColor: '#ffffff' }).then(canvas => {
      const link = document.createElement('a');
      link.download = 'lada-bingo.png';
      link.href = canvas.toDataURL('image/png');
      link.click();
    });
  });

  // Při načtení stránky: pokud existuje uložená kartička v tomto zařízení, načti ji,
  // jinak vygeneruj novou.
  if (!loadState()) {
    buildCard();
  }
</script>

</body>
</html>
